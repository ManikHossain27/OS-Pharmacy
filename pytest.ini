[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results

markers =
    smoke: fast critical-path checks
    regression: full regression suite
    negative: invalid / error-path scenarios
    boundary: boundary-value and limit scenarios
    integration: cross-module data-integrity scenarios
    ui: pure UI / layout / copy checks
    destructive: creates+deletes or permanently edits data (gated by RUN_DESTRUCTIVE_TESTS)
    prod_safe: safe to run against production (read-only, no mutation)
    products: Product module
    customization: Customization module
    inventory: Inventory module
    calc: pure calculation-model tests (no browser)
    e2e: full create-form -> cart -> checkout -> record-details journeys
    security: security-focused checks (injection, XSS, authz)
    blocked: known-blocked in the current environment (see QA report)

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
